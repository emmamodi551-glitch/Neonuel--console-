       SYNTHESIZED CYBERNETIC SOUND ENGINE (WEB AUDIO API)
       Pure code - zero external sound files required.

    class CyberSoundEngine {
      constructor() {
        this.enabled = true;
        this.audioCtx = null;
      }

      initCtx() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.audioCtx = new AudioContext();
          }
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      }

      // High-tech holographic beep
      playBeep(freq = 880, duration = 0.08, type = 'sine') {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.audioCtx) return;

          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.audioCtx.currentTime + duration);

          gain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch (e) {
          console.error("Audio trigger failed", e);
        }
      }

      // Biomechanical shutter / scan sweep sound
      playScanSound() {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (!this.audioCtx) return;

          const now = this.audioCtx.currentTime;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(940, now + 0.16);

          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.16);

          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          osc.start();
          osc.stop(now + 0.16);
        } catch (e) {}
      }

      // Telephony dial chirp
      playChirp() {
        if (!this.enabled) return;
        this.playBeep(1200, 0.05, 'triangle');
        setTimeout(() => this.playBeep(1600, 0.07, 'sine'), 50);
      }
    }

    function updateServiceTotal() {
      let total = 0;

      });
      serviceTotalDisplay.textContent = `$${total}.00`;

    window.onload = function() {

  </script>

  <script>
// Chat Knowledge Matrix
const neonuelKnowledge = [
  {
    queryMatch: ["property", "maintenance", "facility", "care", "quote", "scope"],
    reply: "Nuel Property Services provides routine site maintenance, facility care, and commercial grounds oversight across Central MN. Open the Property Hub to request dispatch."
  },
  {
    queryMatch: ["digital", "assets", "website", "systems", "support", "it", "code"],
    reply: "Nuel Digital Assets specializes in lean automated workflows, digital infrastructure, custom web asset development, and remote technical solutions."
  },
  {
    queryMatch: ["hours", "contact", "phone", "call", "reach", "dispatch"],
    reply: "Direct dispatch line: +1 320-217-3955. Email: nueldigitalassets@gmail.com. You can also tap the 'Call' control on your HUD."
  },
  {
    queryMatch: ["location", "service area", "st. cloud", "area", "where"],
    reply: "Headquartered in St. Cloud, MN, servicing commercial facilities and digital client workflows throughout the region."
  }
];

const fallbackReply = "Command received. For direct assistance, submit an inquiry in the Property Hub or call dispatch at +1 320-217-3955.";

// Helper to render a message bubble in chat
function appendChatMessage(sender, text) {
  const container = document.getElementById("chatMessages");
  if (!container) return;

  const msgDiv = document.createElement("div");
  msgDiv.className = sender === "user" ? "flex justify-end" : "flex justify-start";

  const bubble = document.createElement("div");
  bubble.className = sender === "user"
    ? "bg-cyan-950/80 border border-cyan-500/50 text-cyan-200 px-3 py-2 rounded text-xs max-w-[80%] font-mono"
    : "bg-slate-900 border border-slate-700 text-slate-200 px-3 py-2 rounded text-xs max-w-[80%] font-mono leading-relaxed";

  bubble.innerText = text;
  msgDiv.appendChild(bubble);
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;
}

// Logic to match questions against knowledge base
function processBotQuery(userText) {
  const clean = userText.toLowerCase();
  const found = neonuelKnowledge.find(entry =>
    entry.queryMatch.some(k => clean.includes(k))
  );
  return found ? found.reply : fallbackReply;
}

// Wire form submission & quick chips when DOM is loaded
document.addEventListener("DOMContentLoaded", () => {
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");

  // Handle standard typing + send
  if (chatForm && chatInput) {
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = chatInput.value.trim();
      if (!val) return;

      appendChatMessage("user", val);
      chatInput.value = "";

      setTimeout(() => {
        const botReply = processBotQuery(val);
        appendChatMessage("bot", botReply);
      }, 300);
    });
  }

  // Handle quick chip taps
  document.querySelectorAll(".quick-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const chipText = chip.innerText.trim();
      appendChatMessage("user", chipText);

      setTimeout(() => {
        const botReply = processBotQuery(chipText);
        appendChatMessage("bot", botReply);
      }, 300);
    });
  });
});
</script>
